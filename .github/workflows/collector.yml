name: collector

# La guia metodologica ("Automatizaciones esperadas -> Collector") pide que
# se active cada 30 minutos. Corre igual mientras el stream este vacio (el
# reloj en `waiting`): src/ingest.py deja evidencia en collector_runs incluso
# sin novedades, y el cron de GitHub va en UTC (nunca se fabrica un cursor a
# partir de la hora local).
#
# Se dispara cada 15 minutos en vez de cada 30, y nunca en :00 ni :30: GitHub
# descarta corridas programadas bajo carga (medido aqui: 1 corrida real de 14
# esperadas en 7h) y esos dos minutos son los mas congestionados. Con el doble
# de intentos, la cadencia efectiva se acerca a los 30 minutos que pide la
# guia. Perder una corrida no pierde datos -el cursor es incremental y el
# upsert idempotente, asi que la siguiente corrida recupera el atraso-, pero
# si deja huecos en la bitacora.
on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python src/ingest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Evaluar justo despues de recolectar: la realidad de los targets llega
      # por el mismo stream, asi que este es el momento en que hay datos
      # nuevos que emparejar. Si falla, no debe tumbar la recoleccion: perder
      # una medicion es molesto, perder datos es peor.
      - run: python src/evaluate.py
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
