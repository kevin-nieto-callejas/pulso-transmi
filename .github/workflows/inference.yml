name: inference

# La guia sugiere consultar el ciclo cerca del minuto 07 y del 37, pero
# advierte que "los workflows programados pueden presentar retrasos". Medido
# en este repo: GitHub NO solo retrasa, sino que DESCARTA la mayoria de las
# corridas programadas bajo carga (2 corridas reales de ~28 esperadas en 7h).
# Perder una corrida durante la competencia = perder la ventana de entrega de
# 25 minutos de ese ciclo, o sea 48 predicciones en cero.
#
# Mitigacion en dos capas:
#   1. Disparar cada 10 minutos en minutos "impares" (nunca :00 ni :30, los
#      mas congestionados de GitHub) para que sobren oportunidades.
#   2. Cada corrida vigila 8 minutos mas (PULSO_POLL_MINUTES), revisando cada
#      2 minutos, de modo que una sola corrida que si arranque cubra buena
#      parte de la ventana aunque las siguientes se descarten.
# Reenviar no duplica: la llave de idempotencia es estable por ciclo+modelo y
# src/infer.py ademas consulta si ese ciclo ya fue entregado.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

jobs:
  infer:
    runs-on: ubuntu-latest
    # 8 min de vigilancia + instalacion de dependencias + margen.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[ml]'
      # Cada corrida arranca en una maquina limpia, asi que sin esto se
      # descargaria el artefacto del champion (38 MB) en cada ciclo: ~6 GB por
      # semana de competencia, muy por encima del plan gratuito de Supabase.
      # La clave incluye la version del champion, de modo que promover un
      # modelo nuevo invalida el cache automaticamente.
      - name: Identificar el champion vigente
        id: champion
        run: |
          VERSION=$(curl -s "$SUPABASE_URL/rest/v1/model_versions?status=eq.champion&select=version_id" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            | python -c "import sys,json; d=json.load(sys.stdin); print(d[0]['version_id'] if d else 'ninguno')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Champion vigente: $VERSION"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/cache@v4
        with:
          path: artifacts
          key: modelo-${{ steps.champion.outputs.version }}
      # Recolectar justo antes de inferir deja el ancla lo mas fresca posible.
      # Si el ancla va atrasada respecto al data_cutoff del ciclo, el modelo
      # tiene que extrapolar mas lejos de lo que fue entrenado y el accuracy
      # cae. No falla la inferencia si el collector falla (continue-on-error):
      # es preferible entregar con datos un poco viejos que no entregar.
      - run: python src/ingest.py
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: python src/infer.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          PULSO_POLL_MINUTES: "8"
          PULSO_POLL_INTERVAL_SECONDS: "120"
